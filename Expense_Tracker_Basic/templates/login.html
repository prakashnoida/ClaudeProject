{% extends "base.html" %}
{% import "_macros.html" as ui with context %}

{% block title %}Sign in — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <span class="auth-icon"><i data-lucide="log-in" class="icon-24"></i></span>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your Spendly account</p>
        </div>

        <div class="auth-card">
            {{ ui.flash_messages(show_success=true) }}

            <form method="post" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="mail"></i></span>
                        <input type="email" id="email" name="email"
                               class="form-input" placeholder="you@example.com"
                               value="{{ email or '' }}"
                               autocomplete="email" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="lock"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-input" placeholder="Your password"
                               autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </p>

    </div>
</section>

{% endblock %}
