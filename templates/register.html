{% extends "base.html" %}
{% import "_macros.html" as ui with context %}

{% block title %}Create account — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <span class="auth-icon"><i data-lucide="user-plus" class="icon-24"></i></span>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start tracking your expenses today</p>
        </div>

        <div class="auth-card">
            {{ ui.flash_messages() }}

            <form method="post" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="user"></i></span>
                        <input type="text" id="name" name="name"
                               class="form-input" placeholder="Your name"
                               value="{{ name or '' }}"
                               autocomplete="name" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="mail"></i></span>
                        <input type="email" id="email" name="email"
                               class="form-input" placeholder="you@example.com"
                               value="{{ email or '' }}"
                               autocomplete="email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="lock"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-input" placeholder="Choose a password"
                               autocomplete="new-password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm password</label>
                    <div class="input-group">
                        <span class="input-prefix" aria-hidden="true"><i data-lucide="lock-keyhole"></i></span>
                        <input type="password" id="confirm_password" name="confirm_password"
                               class="form-input" placeholder="Re-enter your password"
                               autocomplete="new-password" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Create account</button>
            </form>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>
</section>

{% endblock %}
